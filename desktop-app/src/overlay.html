<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title data-i18n="app.effectsWindow"></title>
    <style>
      /* See-through over the whole screen, and never in the way of a click. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="still"></canvas>
    <canvas id="moving"></canvas>
    <script src="../node_modules/i18next/dist/umd/i18next.min.js"></script>
    <script src="text.js"></script>
    <script src="screen-effects.js"></script>
  </body>
</html>
