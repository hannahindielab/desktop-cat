<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title data-i18n="look.title"></title>
    <style>
      /* Warm paper, like the cat's bubbles and the cans' hint; what is
         chosen is marked in the bubbles' coffee-brown ink. */
      :root {
        --paper: #fffdf8;
        --paper-2: #f6f0ea;
        --edge: #e4dad3;
        --ink: #816c6a;
        --text-1: #4a3d3b;
        --text-2: #8a7a76;
        --chosen: #816c6a;
        --chosen-text: #fffdf8;
        --off: #d9cfc9;
        --hover: #efe6e0;
        --desk: #e9e4da;
        --words: 'Microsoft JhengHei UI', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans CJK TC', 'Noto Sans TC', sans-serif;
        color-scheme: light dark;
      }

      /* At night: warm dark brown paper, softer edges, lighter words, the coffee lifted. */
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #34302e;
          --paper-2: #3d3835;
          --edge: #4f4744;
          --ink: #a8948f;
          --text-1: #f4eeea;
          --text-2: #bdb0aa;
          --chosen: #c2aca6;
          --chosen-text: #2e2a28;
          --off: #5a524e;
          --hover: #46403c;
          --desk: #2b2826;
        }
      }

      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--text-1);
        font-family: var(--words);
        user-select: none;
      }

      .preview {
        height: 140px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: var(--desk);
        border-bottom: 1px solid var(--edge);
        overflow: hidden;
      }

      /* The cat and its cans as on the desk, at about two thirds of the medium size. */
      .stand {
        position: relative;
        width: 150px;
        height: 130px;
        transform-origin: 50% 100%;
        transition: transform 0.2s;
      }

      /* The same soft shadows as on the desk, at the picture's size, so a
         pale coat stands out from the paper too. */
      .stand .cat {
        position: absolute;
        left: 0;
        top: 0;
        width: 130px;
        height: 130px;
        z-index: 1;
        filter: drop-shadow(0 1.3px 3.3px rgba(0, 0, 0, 0.28));
      }

      .stand .cat svg,
      .stand .cans svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .stand .cans {
        position: absolute;
        left: 103px;
        bottom: 5px;
        width: 36px;
        height: auto;
        filter: drop-shadow(0 0.7px 2px rgba(0, 0, 0, 0.25));
        transition: opacity 0.2s;
      }

      .stand .cans svg {
        height: auto;
      }

      /* Asleep, in front of the cushion's corner, as on the desk. */
      .stand.lying .cans {
        z-index: 2;
      }

      /* Two pages under the one picture: how the cat looks, and where it is. */
      .tabs {
        display: flex;
        gap: 4px;
        padding: 8px 20px 0;
        border-bottom: 1px solid var(--edge);
      }

      .tab {
        margin-bottom: -1px;
        padding: 8px 14px 9px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--text-2);
        font: 500 14px var(--words);
        cursor: pointer;
        transition: color 0.15s;
      }

      .tab:hover {
        color: var(--text-1);
      }

      .tab.on {
        color: var(--text-1);
        border-bottom-color: var(--chosen);
      }

      .tab:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -2px;
        border-radius: 6px;
      }

      main {
        padding: 4px 20px 6px;
      }

      section {
        padding: 18px 0 20px;
        border-bottom: 1px solid var(--edge);
      }

      section:last-child {
        border-bottom: 0;
      }

      h2 {
        margin: 0 0 12px;
        font: 700 13px/1.4 var(--words);
        color: var(--ink);
        letter-spacing: 0.04em;
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 32px;
      }

      /* A setting's name and its choices sit close; one setting stands
         well apart from the next, so each reads as its own. */
      .setting + .setting {
        margin-top: 20px;
      }

      .setting.wide {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      /* Under its name, a row of choices shares the whole width. */
      .setting.wide .segment {
        flex: 1;
      }

      .what {
        font: 500 14px/1.3 var(--words);
      }

      .what small {
        display: block;
        font: 400 11.5px/1.4 var(--words);
        color: var(--text-2);
      }

      .named {
        margin-left: 8px;
        font: 400 12px var(--words);
        color: var(--text-2);
      }

      .segments {
        display: flex;
        background: var(--paper-2);
        border: 1px solid var(--edge);
        border-radius: 9px;
        padding: 2px;
      }

      /* A choice's name stays on one line. */
      .segment {
        border: 0;
        background: none;
        color: var(--text-2);
        font: 500 13px var(--words);
        white-space: nowrap;
        padding: 4px 12px;
        border-radius: 7px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .segment:hover {
        background: var(--hover);
        color: var(--text-1);
      }

      .segment:active {
        transform: scale(0.97);
      }

      .segment.on {
        background: var(--chosen);
        color: var(--chosen-text);
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding-left: 2px;
      }

      .swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 0;
        background: var(--swatch);
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }

      .swatch:hover {
        transform: scale(1.12);
      }

      .swatch:active {
        transform: scale(0.95);
      }

      .swatch.on {
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.15),
          0 0 0 2px var(--paper),
          0 0 0 4px var(--chosen);
      }

      .switch {
        width: 38px;
        height: 22px;
        border-radius: 11px;
        border: 0;
        background: var(--off);
        position: relative;
        cursor: pointer;
        transition: background 0.2s;
      }

      .switch i {
        position: absolute;
        left: 3px;
        top: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: left 0.2s;
      }

      .switch.on {
        background: var(--chosen);
      }

      .switch.on i {
        left: 19px;
      }

      .switch:hover {
        filter: brightness(1.05);
      }

      .segment:focus-visible,
      .swatch:focus-visible,
      .switch:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* With the cans hidden, their colours wait, greyed. */
      .is-off {
        opacity: 0.45;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <div class="stand" id="stand">
        <div class="cat" id="cat"></div>
        <div class="cans" id="cans"></div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab on" role="tab" data-tab="looks" aria-selected="true" data-i18n="look.tabLooks"></button>
      <button class="tab" role="tab" data-tab="place" aria-selected="false" data-i18n="look.tabPlace"></button>
    </nav>
    <main>
      <div data-page="looks">
        <section>
          <h2 data-i18n="look.cat"></h2>
          <div class="setting">
            <div class="what" data-i18n="look.coat"></div>
            <div class="segments" data-look="coat"></div>
          </div>
          <div class="setting">
            <div class="what"><span data-i18n="look.size"></span><small data-i18n="look.sizeHint"></small></div>
            <div class="segments" data-look="size"></div>
          </div>
          <div class="setting wide" data-follows-place>
            <div class="what"><span data-i18n="look.cushion"></span><span class="named" data-named="cushion"></span></div>
            <div class="swatches" data-look="cushion"></div>
          </div>
        </section>
        <section>
          <h2 data-i18n="look.cans"></h2>
          <div class="setting">
            <div class="what"><span data-i18n="look.cansShown"></span><small data-i18n="look.cansShownHint"></small></div>
            <button class="switch" data-switch="cansShown" role="switch" data-i18n="[aria-label]look.cansShown"><i></i></button>
          </div>
          <div class="setting wide" data-needs-cans>
            <div class="what"><span data-i18n="look.canLabel"></span><span class="named" data-named="canLabel"></span></div>
            <div class="swatches" data-look="canLabel"></div>
          </div>
          <div class="setting wide" data-needs-cans>
            <div class="what"><span data-i18n="look.canFood"></span><span class="named" data-named="canFood"></span></div>
            <div class="swatches" data-look="canFood"></div>
          </div>
        </section>
      </div>
      <div data-page="place" hidden>
        <section>
          <div class="setting wide">
            <div class="what"><span data-i18n="look.place"></span><small data-i18n="look.placeHint"></small></div>
            <div class="segments" data-look="place"></div>
          </div>
          <div class="setting" data-needs-place>
            <div class="what"><span data-i18n="look.placeVolume"></span><small data-i18n="look.placeVolumeHint"></small></div>
            <div class="segments" data-look="placeVolume"></div>
          </div>
          <div class="setting" data-needs-place>
            <div class="what"><span data-i18n="look.effects"></span><small data-i18n="look.effectsHint"></small></div>
            <button class="switch" data-switch="effectsOn" role="switch" data-i18n="[aria-label]look.effects"><i></i></button>
          </div>
        </section>
      </div>
    </main>
    <script src="../node_modules/i18next/dist/umd/i18next.min.js"></script>
    <script src="text.js"></script>
    <script src="poses.js"></script>
    <script src="place-art.js"></script>
    <script src="dress.js"></script>
    <script src="cans.js"></script>
    <script src="look.js"></script>
  </body>
</html>
